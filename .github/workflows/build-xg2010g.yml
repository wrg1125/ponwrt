name: Build XG2010G (wrg1125 custom)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xg2010g-build
  cancel-in-progress: false

jobs:
  build:
    name: Build an7581
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-an7581-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-an7581-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure an7581
        run: |
          ./scripts/kconfig.pl + "configs/an7581.config" configs/release.config > .config
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build an7581
        run: make -j"$(nproc)"

      - name: Verify custom packages in manifest (xg2010g)
        run: |
          man=$(find bin/targets/airoha/an7581 -name '*gemtek_xg2010g*.manifest' | head -1)
          [ -n "$man" ] || man=$(find bin/targets/airoha/an7581 -name '*.manifest' | head -1)
          [ -n "$man" ] || { echo "manifest not found"; find bin/targets -maxdepth 3 | head -30; exit 1; }
          echo "使用 manifest: $man"
          echo "── daed ──";   grep -i daed "$man" || echo "MISSING daed!"
          echo "── PHY fw ──"; grep -i en8811 "$man" || echo "MISSING en8811h firmware!"
          echo "── voice ──";  grep -i -E 'voice|pcm-spi|slic' "$man" || echo "(no voice — 符合预期)"

      - name: Pack xg2010g images
        run: |
          mkdir -p release
          find bin/targets/airoha/an7581 -name '*gemtek_xg2010g*' -type f -exec cp -t release/ {} +
          find bin/targets/airoha/an7581 -name 'sha256sums' -exec cp -t release/ {} +
          [ -n "$(ls -A release)" ] || { echo "no xg2010g files"; find bin/targets -maxdepth 3 | head -30; exit 1; }
          ls -la release/

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-xg2010g-images
          path: release/
          if-no-files-found: error
          retention-days: 14
