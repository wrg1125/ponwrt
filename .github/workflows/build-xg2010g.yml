name: Build XG2010G (wrg1125 custom)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xg2010g-build
  cancel-in-progress: false

jobs:
  build:
    name: Build an7581
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-an7581-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-an7581-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Use prebuilt honk package (skip Rust source build)
        run: |
          set -e
          test -d feeds/daeuniverse/honk
          cp build/daeuniverse-honk-prebuilt.mk feeds/daeuniverse/honk/Makefile
          echo "── honk Makefile 关键行 ──"
          grep -E '^(PKG_HASH|PKG_SOURCE):=' feeds/daeuniverse/honk/Makefile
          grep -n 'vmlinux-btf-builtin' feeds/daeuniverse/honk/Makefile
          rm -rf package/feeds/daeuniverse/honk
          ./scripts/feeds install honk luci-app-honk luci-lib-daeuniverse luci-i18n-daeuniverse-zh-cn vmlinux-btf-builtin

      - name: Apply MBI RX overrun -> MAC epoch reset patch (pbs05/ponwrt#49)
        run: |
          set -e
          cd feeds/pon_drivers/airoha-xpon
          ( cd src && git apply -p1 --verbose "$GITHUB_WORKSPACE/build/mbi-reset.patch" )
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=69/" Makefile
          echo "── PKG_RELEASE ──"; grep '^PKG_RELEASE' Makefile
          echo "── 补丁标记 (应为 2 / 1) ──"
          grep -c mbi_reset_pending src/airoha-xpon-private.h
          grep -c 'MBI RX overrun storm' src/airoha-xpon-main.c

      - name: Configure an7581
        run: |
          ./scripts/kconfig.pl + "configs/an7581.config" configs/release.config > .config
          # 只编 gemtek_xg2010g, 其余 an7581 设备全关 (省一半以上构建时间)
          sed -i -E '/gemtek_xg2010g/!s/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_([A-Za-z0-9_.+-]+)=y$/# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_\1 is not set/' .config
          # ── honk（官方包：honk 核心 + LuCI 界面 + 共享库）──
          for k in kmod-veth kmod-nft-queue kmod-nft-core kmod-nf-conntrack kmod-nfnetlink-queue \
                   honk luci-app-honk luci-lib-daeuniverse luci-i18n-daeuniverse-zh-cn vmlinux-btf-builtin; do
            grep -q "^CONFIG_PACKAGE_$k=y" .config || echo "CONFIG_PACKAGE_$k=y" >> .config
            sed -i "s/^# CONFIG_PACKAGE_$k is not set$/CONFIG_PACKAGE_$k=y/" .config
          done
          # honk 需要 cgroup v2 + CGROUP_BPF；NET_XGRESS 由 NET_CLS_ACT 自动选中
          sed -i 's/^# CONFIG_KERNEL_CGROUP_BPF is not set/CONFIG_KERNEL_CGROUP_BPF=y/' .config
          grep -q '^CONFIG_KERNEL_CGROUP_BPF=' .config || echo 'CONFIG_KERNEL_CGROUP_BPF=y' >> .config
          grep -q '^CONFIG_KERNEL_NET_CLS_ACT=' .config || echo 'CONFIG_KERNEL_NET_CLS_ACT=y' >> .config
          make defconfig
          echo "── 本次构建的设备 ──"
          grep -E '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_[A-Za-z0-9_.+-]+=y$' .config
          echo "── honk 与内核前提 ──"
          grep -E '^CONFIG_(KERNEL_CGROUP_BPF|KERNEL_NET_CLS_ACT|KERNEL_BPF_SYSCALL|KERNEL_BPF_JIT)=y$' .config
          grep -E '^CONFIG_PACKAGE_kmod-(veth|nft-queue|nft-core|nf-conntrack)=y$' .config || { echo "ERROR: honk 依赖 kmod 缺失"; exit 1; }
          echo "── honk + LuCI 界面是否被选中 (必须有输出) ──"
          grep -E '^CONFIG_PACKAGE_(honk|luci-app-honk|luci-lib-daeuniverse|luci-i18n-daeuniverse-zh-cn|vmlinux-btf-builtin)=y$' .config || { echo "ERROR: honk/LuCI 未被选中"; exit 1; }
          echo "── dae/daed 是否被选中 (不该有输出) ──"
          grep -E '^CONFIG_PACKAGE_(dae|dae-geoip|dae-geosite|daed|luci-app-dae|luci-app-daede)=y$' .config || echo "OK: dae/daed 全部关闭"
          echo "── dae 依赖是否保留 (应有输出) ──"
          grep -E '^CONFIG_(PACKAGE_(kmod-sched-core|kmod-sched-bpf|kmod-veth|kmod-inet-diag|kmod-netlink-diag|kmod-xdp-sockets-diag|v2ray-geoip|v2ray-geosite|ca-bundle)|KERNEL_(XDP_SOCKETS|BPF_SYSCALL|BPF_JIT|BPF_EVENTS|DEBUG_INFO_BTF))=y$' .config

      - name: Preflight honk package (prepare only, catches unpack errors early)
        run: |
          set -o pipefail
          make package/feeds/daeuniverse/honk/prepare V=s 2>&1 | tail -40
          test -f build_dir/target-*/honk-prebuilt-*/honk-core || { echo "ERROR: honk-core 未解包出来"; find build_dir -maxdepth 3 -name 'honk*' | head; exit 1; }
          echo "OK: honk-core 已就位: $(ls -l build_dir/target-*/honk-prebuilt-*/honk-core)"

      - name: Inject personalization from secrets
        env:
          PPPoE_USER: ${{ secrets.PPPOE_USER }}
          PPPoE_PASS: ${{ secrets.PPPOE_PASS }}
          ROOT_HASH: ${{ secrets.ROOT_HASH }}
          HONK_NODE: ${{ secrets.HONK_NODE }}
        run: bash scripts/wrg1125-inject.sh

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build an7581
        run: make -j"$(nproc)"

      - name: Verify custom packages in manifest (xg2010g)
        run: |
          man=$(find bin/targets/airoha/an7581 -name '*gemtek_xg2010g*.manifest' | head -1)
          [ -n "$man" ] || man=$(find bin/targets/airoha/an7581 -name '*.manifest' | head -1)
          [ -n "$man" ] || { echo "manifest not found"; find bin/targets -maxdepth 3 | head -30; exit 1; }
          echo "使用 manifest: $man"
          echo "── dae/daed (本版应缺失) ──"
          if grep -qE "^(dae|dae-geoip|dae-geosite|daed|luci-app-daede)[[:space:]]" "$man"; then
            echo "ERROR: dae/daed 仍在镜像里"; exit 1
          else
            echo "OK: dae/daed 未安装"
          fi
          echo "── dae/daed 依赖 (本版应存在) ──"
          for p in kmod-sched-core kmod-sched-bpf kmod-veth kmod-inet-diag kmod-netlink-diag kmod-xdp-sockets-diag v2ray-geoip v2ray-geosite ca-bundle; do
            grep -qE "^$p[[:space:]]" "$man" && echo "  OK   $p" || { echo "  MISS $p"; exit 1; }
          done
          echo "── airoha-xpon (应为 r69 = 带补丁) ──"
          grep -E "^kmod-airoha-xpon[[:space:]]" "$man" || { echo "MISSING kmod-airoha-xpon"; exit 1; }
          echo "── honk 包与 LuCI 界面 ──"
          for p in honk luci-app-honk luci-lib-daeuniverse luci-i18n-daeuniverse-zh-cn vmlinux-btf-builtin; do
            grep -qE "^$p[[:space:]]" "$man" && echo "  OK   $p" || { echo "  MISS $p"; exit 1; }
          done
          BIN=$(ls -1 build_dir/target-*/root-*/usr/bin/honk-core 2>/dev/null | head -1)
          if [ -n "$BIN" ]; then echo "  OK $BIN ($(stat -c%s "$BIN") bytes)"; else echo "ERROR: rootfs 里没有 honk-core"; exit 1; fi
          for f in etc/init.d/honk etc/config/honk etc/honk/config.dae www/luci-static/resources/view/honk/main.js usr/share/luci/menu.d/luci-app-honk.json; do
            R=$(ls -1 build_dir/target-*/root-*/$f 2>/dev/null | head -1)
            [ -n "$R" ] && echo "  OK   /$f" || { echo "  MISS /$f"; exit 1; }
          done
          grep -E "^kmod-(veth|nft-queue|nft-core|nf-conntrack)[[:space:]]" "$man" || { echo "ERROR: honk 依赖缺失"; exit 1; }
          echo "── adguardhome ──"; grep -E "^(adguardhome|luci-app-adguardhome) " "$man" || echo "MISSING adguardhome!"
          echo "── PHY fw ──"; grep -E "^(airoha-en8811h-firmware|rtl826x-firmware|rtl8261c-firmware) " "$man" || echo "MISSING PHY fw!"
          echo "── PON ──";  grep -E "^(kmod-airoha-xpon|airoha-pon|luci-app-pon)" "$man" || echo "MISSING PON!"

      - name: Pack xg2010g images
        run: |
          mkdir -p release
          find bin/targets/airoha/an7581 -name '*gemtek_xg2010g*' -type f -exec cp -t release/ {} +
          find bin/targets/airoha/an7581 -name 'sha256sums' -exec cp -t release/ {} +
          [ -n "$(ls -A release)" ] || { echo "no xg2010g files"; find bin/targets -maxdepth 3 | head -30; exit 1; }
          ls -la release/

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-xg2010g-images
          path: release/
          if-no-files-found: error
          retention-days: 14
